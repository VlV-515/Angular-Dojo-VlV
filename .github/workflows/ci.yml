name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, tests y catálogo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Generar catálogo y validar schema
        run: npm run catalog

      - name: Build del shell
        run: npm run build

      - name: Unit tests del shell (Jest, zoneless)
        run: npm run test:unit

      - name: e2e del shell (Playwright)
        run: npx playwright test

      - name: challenges.json debe estar al día
        run: |
          if ! git diff --exit-code -- challenges.json; then
            echo "::error::challenges.json no coincide con challenges/*/meta.json. Corre 'npm run catalog' y commitea el resultado." >&2
            exit 1
          fi

  quality-invariant:
    name: Invariante — roto FALLA, solución PASA
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Tag base-v1 (baseline para materializar ramas)
        run: git tag -f base-v1 HEAD

      - name: Materializar cada reto y validar el invariante
        run: npm run ci:check-challenges
