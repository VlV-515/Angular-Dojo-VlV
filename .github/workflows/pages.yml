name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'challenges.json'
      - 'docs/demo.gif'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar sitio en GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Armar sitio (catálogo + GIF)
        run: |
          cp challenges.json site/challenges.json
          cp docs/demo.gif site/demo.gif

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
