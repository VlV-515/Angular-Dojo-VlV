<h1>Inventario del dojo</h1>

<ul class="inventario-list">
  @for (item of items; track item.id) {
    <li>
      <span>{{ item.nombre }}</span>
      <span>{{ item.cantidad | number }}</span>
      <app-item-badge [nivel]="item.cantidad" />
      @if (item.cantidad <= stockMinimo(item.categoria)) {
        <span class="alerta">Reponer</span>
      }
    </li>
  }
</ul>

<app-item-detail [id]="items[0].id" />
