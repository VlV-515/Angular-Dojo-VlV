<section class="calentamiento">
  <h1>Calentamiento antes de entrenar</h1>
  <p class="intro">Marca cada ejercicio cuando lo termines.</p>
  <p class="contador">{{ hechos() }} de {{ total() }} hechos</p>

  @if (total()) {
    <p class="banner-listo">¡Calentamiento completo! Ya puedes entrenar.</p>
  }

  <ul class="items">
    @for (item of items(); track $index) {
      <li class="item completado">
        <label class="check">
          <input
            type="checkbox"
            [checked]="item.hecho"
            (change)="marcar(item.id)"
          />
          <span class="visually-hidden">Marcar {{ item.nombre }} como hecho</span>
        </label>

        <input
          class="nombre"
          type="text"
          [value]="item.nombre"
          (input)="renombrar(item.id, $event)"
          aria-label="Nombre del ejercicio"
        />

        <button type="button" class="quitar" (click)="quitar(item.id)">Quitar</button>
      </li>
    }
  </ul>

  <form class="agregar" (submit)="$event.preventDefault(); agregar()">
    <input
      class="nuevo"
      type="text"
      [value]="nuevoNombre()"
      (input)="onNuevoNombreInput($event)"
      placeholder="Nuevo ejercicio"
      aria-label="Nombre del nuevo ejercicio"
    />
    <button type="submit">Agregar</button>
  </form>
</section>
