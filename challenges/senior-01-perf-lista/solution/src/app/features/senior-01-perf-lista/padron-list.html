<h1>Padrón del dojo</h1>

<input
  type="search"
  placeholder="Buscar alumno..."
  (input)="onFiltroChange($any($event.target).value)"
/>

@defer (on viewport) {
  <section class="resumen">
    <p>{{ resumenEstadistico().total }} alumnos · {{ resumenEstadistico().enRacha }} en racha</p>
  </section>
} @placeholder {
  <section class="resumen resumen--placeholder">Cargando resumen…</section>
}

<div class="padron-viewport" [style.height.px]="altoContenedor" (scroll)="onScroll($event)">
  <div class="padron-track" [style.height.px]="alturaTotal()">
    <ul class="padron" [style.transform]="'translateY(' + desplazamiento() + 'px)'">
      @for (a of filasVisibles(); track a.id) {
        <li class="fila" [style.height.px]="altoFila">
          <span class="nombre">{{ a.nombre }}</span>
          <span class="cinturon">{{ a.cinturon | cinturonLabel }}</span>
          <span class="racha">{{ resumenRacha(a) }}</span>
        </li>
      }
    </ul>
  </div>
</div>
