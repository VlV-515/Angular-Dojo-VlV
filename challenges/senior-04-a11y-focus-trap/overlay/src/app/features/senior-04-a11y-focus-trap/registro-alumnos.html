<h1>Registro de alumnos</h1>
<p>Administra las altas de nuevos alumnos del dojo.</p>

<button type="button" #triggerBtn class="btn-primario" (click)="abrirDialogo()">
  Nuevo alumno
</button>

@if (dialogoAbierto()) {
  <div class="dialogo-fondo">
    <div #dialogoRoot class="dialogo" role="dialog">
      <h2 id="dialogo-titulo">Registrar alumno</h2>

      <form>
        <label>
          Nombre
          <input #primerCampo type="text" name="nombre" autocomplete="off" />
        </label>

        <label>
          Cinturón
          <select name="cinturon">
            <option value="blanco">Blanco</option>
            <option value="azul">Azul</option>
            <option value="negro">Negro</option>
          </select>
        </label>

        <div class="dialogo-acciones">
          <button type="button" (click)="guardar()">Guardar</button>
          <button type="button" (click)="cerrarDialogo()">Cerrar</button>
        </div>
      </form>
    </div>
  </div>
}

<a routerLink="/" class="volver-catalogo">Volver al catálogo</a>
