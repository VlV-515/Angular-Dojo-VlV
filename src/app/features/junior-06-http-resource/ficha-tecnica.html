<h1>Ficha técnica</h1>

<div class="selector" role="group" aria-label="Elegir técnica">
  @for (op of opciones; track op.id) {
    <button
      type="button"
      class="chip"
      [class.activo]="seleccionado() === op.id"
      (click)="seleccionar(op.id)"
    >
      {{ op.etiqueta }}
    </button>
  }
</div>

<!-- Bug: se lee ficha.value() directo, sin comprobar antes ficha.isLoading() ni ficha.error(). -->
<section class="ficha">
  <h2>{{ ficha.value()?.nombre }}</h2>
  <p class="cinturon">{{ ficha.value()?.cinturon }}</p>
  <p class="descripcion">{{ ficha.value()?.descripcion }}</p>
  <ul>
    @for (p of ficha.value()?.puntosClave ?? []; track p) {
      <li>{{ p }}</li>
    }
  </ul>
  <p class="meta">Consultada {{ ficha.value()?.consultas }} veces</p>
</section>

<button type="button" class="reintentar" (click)="reintentar()">Reintentar</button>
